<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>CBSA commute map (dots)</title>
<style>
  body { font-family: sans-serif; margin:0; }
  svg { display:block; margin:0 auto; background: #f7f7f7; }
  .state { fill: #eee; stroke: #999; stroke-width: 0.8px; }
  .cbsa-dot { fill: steelblue; stroke: #fff; stroke-width: 0.6px; opacity: 0.9; }
  .tooltip {
    position: absolute;
    pointer-events: none;
    padding: 6px 8px;
    background: rgba(0,0,0,0.8);
    color: #fff;
    border-radius: 4px;
    font-size: 12px;
    display: none;
  }
</style>
</head>
<body>

<div id="vis"></div>
<div id="tooltip" class="tooltip"></div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>

<script>
(async () => {
  const width = 1000, height = 650;
  const svg = d3.select("#vis").append("svg").attr("width", width).attr("height", height);

  // Projection and path
  const projection = d3.geoAlbersUsa().scale(1200).translate([width/2, height/2]);
  const path = d3.geoPath().projection(projection);

  // Tooltip
  const tooltip = d3.select("#tooltip");

  // Load US state topology (us-atlas) for state outlines (not counties)
  // Using topojson 'states-10m.json' from us-atlas via CDN
  const usTopo = await d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json");
  const states = topojson.feature(usTopo, usTopo.objects.states);

  // Draw states
  svg.append("g")
    .selectAll("path")
    .data(states.features)
    .join("path")
    .attr("class", "state")
    .attr("d", path);

  // Load your merged CBSA GeoJSON
  const cbsa = await d3.json("cbsa_commute.geojson"); // adjust filename if different

  // Helper to compute a safe pixel centroid for a feature.
  // Returns [x,y] in SVG pixel coordinates, or null if can't compute.
  function safePixelCentroid(feature) {
    // 1) Try path.centroid (returns pixel coordinates directly)
    try {
      const c = path.centroid(feature);
      if (Array.isArray(c) && isFinite(c[0]) && isFinite(c[1])) {
        // Some centroids are outside projection bounds (e.g., for Alaska or invalid)
        if (!isNaN(c[0]) && !isNaN(c[1]) && Math.abs(c[0]) < 1e6 && Math.abs(c[1]) < 1e6) {
          return c;
        }
      }
    } catch (e) {
      // ignore and try fallback
    }

    // 2) Fallback: compute geographic midpoint from geoBounds then project
    try {
      const b = d3.geoBounds(feature); // [[minLon,minLat],[maxLon,maxLat]]
      if (b && b.length === 2) {
        const lon = (b[0][0] + b[1][0]) / 2;
        const lat = (b[0][1] + b[1][1]) / 2;
        const p = projection([lon, lat]);
        if (p && isFinite(p[0]) && isFinite(p[1])) return p;
      }
    } catch (e) {
      // ignore
    }

    // 3) No centroid available
    return null;
  }

  // Draw CBSA polygons lightly (optional)
  svg.append("g")
    .selectAll("path")
    .data(cbsa.features)
    .join("path")
    .attr("d", path)
    .attr("fill", "none")
    .attr("stroke", "rgba(0,0,0,0.06)")
    .attr("stroke-width", 0.6);

  // Create group for dots
  const dotsG = svg.append("g").attr("class", "dots");

  let skipped = 0;
  const points = [];

  cbsa.features.forEach(f => {
    const pix = safePixelCentroid(f);
    if (!pix) {
      skipped += 1;
      return;
    }
    // store for drawing
    points.push({ feature: f, x: pix[0], y: pix[1] });
  });

  console.log("CBSA features total:", cbsa.features.length, "points computed:", points.length, "skipped:", skipped);

  // Draw circles
  dotsG.selectAll("circle")
    .data(points)
    .join("circle")
    .attr("class", "cbsa-dot")
    .attr("cx", d => d.x)
    .attr("cy", d => d.y)
    .attr("r", 4)
    .on("mouseover", function(event, d) {
      const p = d.feature.properties;
      const name = p.NAME_y || p.NAME_x || p.NAME || p.Name || "CBSA";
      const html = `<strong>${name}</strong><br/>
                    Transit: ${p.transit_percent ?? "N/A"}%<br/>
                    Bike: ${p.bike_percent ?? "N/A"}%<br/>
                    Walk: ${p.walk_percent ?? "N/A"}%<br/>
                    Drive: ${p.car_percent ?? "N/A"}%<br/>
                    WFH: ${p.wfh_percent ?? "N/A"}%`;
      tooltip.html(html).style("display", "block");
    })
    .on("mousemove", function(event) {
      tooltip.style("left", (event.pageX + 10) + "px").style("top", (event.pageY + 12) + "px");
    })
    .on("mouseout", function() {
      tooltip.style("display", "none");
    });

  // Optional: zoom/transform on click to center on CBSA
  svg.on("click", (event) => {
    // Example: reset zoom on background click
    svg.transition().duration(600).attr("transform", null);
  });

})();
</script>
</body>
</html>
